slug: kleinunternehmerregelung
term: Kleinunternehmerregelung
short: Nach § 19 UStG müssen kleine Unternehmen mit geringem Umsatz keine Umsatzsteuer ausweisen und abführen.
definition: >-
  Die Kleinunternehmerregelung nach § 19 des Umsatzsteuergesetzes befreit Unternehmen mit geringem
  Umsatz von der Umsatzsteuer. Voraussetzung ist laut Gesetz, dass der Gesamtumsatz im
  vorangegangenen Kalenderjahr 25.000 Euro nicht überschritten hat und im laufenden Kalenderjahr
  100.000 Euro nicht überschreitet. Kleinunternehmer weisen auf ihren Rechnungen keine Umsatzsteuer
  aus und können im Gegenzug keine Vorsteuer abziehen. Rechnungsprogramme sollten die Regelung
  deshalb als Einstellung anbieten, damit der passende Hinweis auf jeder Rechnung steht.
status: draft
