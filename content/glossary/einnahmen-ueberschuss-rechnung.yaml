slug: einnahmen-ueberschuss-rechnung
term: Einnahmen-Überschuss-Rechnung (EÜR)
short: Die vereinfachte Gewinnermittlung nach § 4 Abs. 3 EStG für alle, die nicht zur Buchführung verpflichtet sind.
definition: >-
  Wer nicht auf Grund gesetzlicher Vorschriften verpflichtet ist, Bücher zu führen und regelmäßig
  Abschlüsse zu machen, und das auch nicht freiwillig tut, kann nach § 4 Absatz 3 des
  Einkommensteuergesetzes als Gewinn den Überschuss der Betriebseinnahmen über die
  Betriebsausgaben ansetzen. Diese Einnahmen-Überschuss-Rechnung ist für viele Freiberufler und
  kleine Gewerbetreibende die übliche Form der Gewinnermittlung. Buchhaltungsprogramme erstellen
  sie aus den erfassten Einnahmen und Ausgaben, manche übermitteln die Anlage EÜR direkt per ELSTER.
status: published
lastReviewed: 2026-10-24
