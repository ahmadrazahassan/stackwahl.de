pros:
  - Doppelte Buchführung mit Debitoren und Kreditoren, also auch für bilanzierende Unternehmen.
  - In jedem Paket ist ein Zugang für die Steuerberatung enthalten.
  - Mehr als 5.000 Banken über drei Schnittstellenpartner anbindbar.
  - Hosting laut Datenschutzbestimmungen ausschließlich in Rechenzentren in Deutschland.
  - 14 Tage kostenlos und unverbindlich testen, mit Sprechstunde für Testnutzer.
cons:
  - Mit 39,90 € im Monat bei monatlicher Laufzeit teurer als reine Einsteigerprogramme.
  - Pro Monat stehen im Rahmen der Fair-Use-Regel 500 Belege zur Verfügung.
  - Nur das Paket Premium enthält mehr als einen Nutzer (5 Nutzerzugänge).
idealFor:
  - Kleine und mittlere Unternehmen, die selbst buchen oder mit der Steuerberatung arbeitsteilig buchen
  - Bilanzierende Unternehmen und Online-Händler
notIdealFor:
  - Freiberufler mit wenigen Belegen, die nur Rechnungen schreiben wollen
