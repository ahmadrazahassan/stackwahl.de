pros:
  - Warenwirtschaft, Rechnungswesen und Produktion als Module, die sich einzeln buchen und kombinieren lassen.
  - Veröffentlichte Ab-Preise je Nutzer statt reiner Preise auf Anfrage.
  - E-Rechnung in beide Richtungen mit OCR, Freigabe-Workflow und revisionssicherem Belegarchiv.
  - DATEV-Export und -Import sowie Umsatzsteuer-Voranmeldung via Elster im Rechnungswesen.
  - Betrieb auf eigenen Servern oder in der Cloud mit deutschen Rechenzentren.
cons:
  - Die Preise gelten bei jährlicher Rechnungsstellung mit 12 Monaten Mindestlaufzeit.
  - CRM, Projektmanagement, DMS und Webshop sind Zusatzlösungen mit Preisen auf Anfrage.
  - Für die Cloud-Version nennt die FAQ nur ein individuelles Angebot.
  - Eine kostenlose Testversion nennt die Produktseite nicht, nur eine Produkttour.
idealFor:
  - Mittelständische Handels- und Fertigungsunternehmen, die ein anpassbares ERP mit Produktion und Finanzbuchhaltung suchen
notIdealFor:
  - Kleine Betriebe, die nur Rechnungen schreiben und Belege sammeln
  - Unternehmen, die eine monatlich kündbare Browserlösung ohne Einführungsprojekt suchen
