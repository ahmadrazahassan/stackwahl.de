pros:
  - Dauerhaft kostenloses Paket mit 50 Dokumenten im Monat, inklusive E-Rechnung.
  - DATEV-Anbindung und Steuerberater-Zugang schon im kostenlosen Paket.
  - Bei jährlicher Zahlung bis zu 29 % günstiger.
cons:
  - Das Paket Free erlaubt nur 3 Kontakte, Starter 20 Kontakte.
  - Wiederkehrende Dokumente erst ab Paket Professional für 25 € im Monat.
  - Die Zahl der Dokumente ist je Paket begrenzt, im Paket Free auf 50 und im Paket Starter auf 250 im Monat.
idealFor:
  - Onlinehändler und Dienstleister, die viele Rechnungen automatisiert erstellen
notIdealFor:
  - Selbstständige, die auch ihre Buchhaltung und Umsatzsteuer im selben Werkzeug erledigen wollen
