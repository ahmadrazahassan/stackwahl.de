pros:
  - Dauerhaft kostenloser Tarif für bis zu 3 E-Rechnungen im Monat in ZUGFeRD und XRechnung.
  - DATEV- und ADDISON-Schnittstelle schon im kleinsten Bezahltarif Rechnung.
  - Umsatzsteuer-Voranmeldung direkt per ELSTER, ohne eigenes Zertifikat.
  - Persönlicher Support per Live-Chat, E-Mail und Telefon in den Bezahltarifen.
cons:
  - Jeder Tarif enthält nur einen Benutzer, weitere kosten je 5,90 € im Monat.
  - Die Listenpreise liegen bei monatlicher Zahlung deutlich über den beworbenen Aktionspreisen.
  - REST-API und Kostenstellen gibt es erst im teuersten Tarif Buchhaltung Pro.
