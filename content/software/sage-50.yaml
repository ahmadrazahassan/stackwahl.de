pros:
  - Buchhaltung, Warenwirtschaft und Auftragsbearbeitung in einem Programm, mit Lager über mehrere Standorte.
  - E-Rechnungen in XRechnung und ZUGFeRD senden und empfangen, in beiden Paketen enthalten.
  - DATEV-Schnittstelle und Belegexport als CSV- und ZIP-Datei für die Steuerberatung.
  - 30 Tage kostenlos testen, ohne Zahlungsangaben, die Testphase endet automatisch.
  - Onlinebanking mit Sammelüberweisungen, Lastschriften und automatischem Abgleich offener Posten.
cons:
  - Comfort ist erst ab 2 Arbeitsplätzen, Professional erst ab 3 Arbeitsplätzen buchbar.
  - Der Listenpreis gilt bei jährlicher Rechnungsstellung mit 12 Monaten Mindestlaufzeit.
  - Kosten- und Erlösrechnung sowie Variantenartikel gibt es erst im Paket Professional.
  - Ob die UStVA direkt per ELSTER übertragen wird, nennt die Produktseite nicht.
idealFor:
  - Kleine Handels-, Produktions- und Dienstleistungsbetriebe mit Lager, die Warenwirtschaft und Buchhaltung in einem Programm führen wollen
notIdealFor:
