pros:
  - GoBD-konforme Archivierung und Serverstandort Deutschland in allen Plänen.
  - Buchungsdatenexport für DATEV, Agenda, Simba, ADDISON und Stotax.
  - Persönlicher Support per Telefon, Mail und Fernwartung in jedem Plan.
  - Die Pläne bauen aufeinander auf, vom Auftragswesen bis zur Warenwirtschaft mit Lager und Einkauf.
cons:
  - Mit 49 € im Monat im Einstiegsplan teurer als reine Rechnungsprogramme.
  - Weitere Büronutzer kosten je 20 € im Monat.
  - API und wiederkehrende Rechnungen sind kostenpflichtige Add-ons.
idealFor:
  - Handwerks- und Handelsbetriebe, die Aufträge, Buchhaltung und später Lager in einem System wollen
notIdealFor:
  - Freiberufler mit wenigen Rechnungen im Monat
