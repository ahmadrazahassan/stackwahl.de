pros:
  - Kostenloser Einstieg im Paket Free, ideal zum Ausprobieren.
  - E-Rechnungen in XRechnung und ZUGFeRD in allen Paketen erstellen und empfangen.
  - Kleinunternehmerregelung lässt sich aktivieren.
  - Hosting, Datensicherung und Support sind im Preis enthalten.
cons:
  - Das Paket Free ist auf 15 Belege im Monat begrenzt.
  - Zusätzliche Nutzer kosten 2,90 € im Monat, bei Jahreszahlung 2,32 €.
  - Die UStVA muss als XML-Datei selbst im ELSTER-Portal hochgeladen werden.
