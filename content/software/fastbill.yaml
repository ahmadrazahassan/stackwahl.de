pros:
  - E-Rechnungen in ZUGFeRD und XRechnung erstellen, senden und empfangen, in allen Tarifen.
  - DATEV-Export und Steuerberaterzugang schon im Tarif Solo für 9 € im Monat.
  - Kleinunternehmerregelung lässt sich einstellen.
  - 14 Tage kostenlos testen, ohne Abo.
cons:
  - Mehrere Benutzer erst ab Tarif Pro für 27 € im Monat.
  - Automatischer Bankabgleich und automatische Belegerfassung nur im Tarif Premium.
  - Im Tarif Solo ist nur ein Bankkonto angebunden, im Tarif Plus fünf.
