pros:
  - In einem deutschen Rechenzentrum auf Microsoft Azure gehostet, laut Anbieter mit ISO-27001-zertifizierter Cloud.
  - Sehr breiter Funktionsumfang mit Produktion, Qualitätsmanagement, Servicemanagement und Projektcontrolling.
  - Kostenlose Mobile App für iOS und Android mit Zugriff auf alle Funktionen.
  - Über 60 Schnittstellen, darunter Elster, BANKSapi, Shopware, HubSpot und Microsoft.
  - Rechenbeispiele je Branche zeigen die Größenordnung der Lizenzkosten.
