pros:
  - 30 Tage kostenlose Testphase mit allen Funktionen der Version XL und der Lohnabrechnung.
  - Alle Versionen sind monatlich kündbar.
  - Lohnabrechnung lässt sich zu jeder Version für 12,90 € im Monat hinzubuchen.
  - Daten in mehreren ISO-27001-geprüften Rechenzentren in Frankfurt am Main.
cons:
  - Buchhaltung mit EÜR und Umsatzsteuer erst ab Version L für 21,90 € im Monat.
  - Die DATEV-Übergabe läuft über die Pendelakte zur Kanzlei, einen Export zum Selbstbuchen nennt die Preisseite nicht.
  - Die Anzahl der enthaltenen Benutzer nennt die Preisseite nicht.
idealFor:
  - Selbstständige und kleine Unternehmen mit Mitarbeitenden, die Lohn und Buchhaltung in einem Werkzeug wollen
notIdealFor:
  - Unternehmen, die einen klassischen DATEV-Export im eigenen Haus brauchen (vorher prüfen)
