  - id: fahrplan
    title: Ihr Fahrplan für die nächsten Monate
    paragraphs:
      - Sorgen Sie zuerst dafür, dass eingehende E-Rechnungen ankommen und lesbar sind, denn diese Pflicht gilt bereits. Stellen Sie danach Ihre Ausgangsrechnungen um, spätestens für Umsätze ab 2027, wenn Ihr Vorjahresumsatz über 800.000 € liegt, und für Umsätze ab 2028 in jedem Fall. Fragen Sie Ihre wichtigsten Kunden, welches Format sie bevorzugen, und stimmen Sie den Ablauf mit Ihrer Steuerberatung ab.
      - Nutzen Sie die Testphasen der Programme, um eine echte E-Rechnung zu erzeugen und einzulesen, bevor Sie sich festlegen. Dieser Artikel ersetzt keine Steuerberatung, er fasst die gesetzlichen Regeln und die Angaben der Anbieter zusammen.
    sources:
      - *ustg27
