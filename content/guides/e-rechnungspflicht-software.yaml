title: "E-Rechnungspflicht 2025 bis 2028: Was Ihr Unternehmen jetzt braucht"
description: Seit 2025 müssen Unternehmen E-Rechnungen empfangen können, der Versand folgt bis 2028. Fristen, Formate und passende Software im Überblick.
centralQuestion: Welche Pflichten gelten für meine Rechnungen bis 2028, und welche Software erfüllt sie heute schon?
