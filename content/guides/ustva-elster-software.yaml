description: Welche Buchhaltungsprogramme die Umsatzsteuer-Voranmeldung selbst an das Finanzamt übertragen, ab welchem Tarif und was es kostet.
centralQuestion: Mit welcher Software kann ich die Umsatzsteuer-Voranmeldung direkt aus der Buchhaltung senden, ohne das ELSTER-Portal?
