intro: Wer umsatzsteuerpflichtig ist, meldet die Umsatzsteuer monatlich oder vierteljährlich an. Viele Selbstständige erledigen das im ELSTER-Portal und tippen die Werte aus der Buchhaltung ab, mit Fehlerrisiko und Zeitaufwand. Einfacher ist es, wenn das Buchhaltungsprogramm die Voranmeldung aus den Buchungen erzeugt und selbst überträgt. Wir haben in allen Profilen nachgesehen, welche Programme das laut Anbieter können, ab welchem Tarif und wo es Einschränkungen gibt.
sections:
  - id: warum
    title: Warum die direkte Übertragung Zeit spart
    paragraphs:
      - "§ 18 UStG verpflichtet Unternehmer, die Voranmeldung auf elektronischem Weg an das Finanzamt zu übermitteln. Ob Sie dafür das ELSTER-Portal nutzen oder ein Programm, das eine zertifizierte ELSTER-Schnittstelle enthält, bleibt Ihnen überlassen."
      - Der Vorteil eines Programms mit eigener Übertragung liegt auf der Hand. Die Werte entstehen aus Ihren Rechnungen und Belegen, Sie prüfen eine Vorschau und senden mit einem Klick. Mehrere Anbieter werben ausdrücklich damit, dass Sie dafür kein eigenes ELSTER-Zertifikat benötigen.
    sources:
      - *ustg18
  - id: guenstig
    title: Günstige Programme mit direkter Übertragung
    paragraphs:
      - FastBill reicht die Umsatzsteuer-Voranmeldung laut Funktionsseite direkt beim Finanzamt ein, ohne gesondertes ELSTER-Zertifikat, und führt sie schon im Tarif Solo für 9 € im Monat bei jährlicher Abbuchung. Eine Einschränkung nennt FastBill selbst, die Voranmeldung wird bei Soll-Versteuerung automatisch ausgefüllt. Wer nach vereinnahmten Entgelten versteuert, sollte das in der Testphase prüfen.
      - WISO MeinBüro überträgt die Voranmeldung über die ELSTER-Schnittstelle schon im kleinsten Plan für 130,80 € im Jahr, der allerdings auf 25.000 € Umsatz in 365 Tagen begrenzt ist. Collmex sendet die Voranmeldung laut Funktionsseite mit einem Mausklick aus dem Programm, ohne separates Programm, und ist monatlich kündbar.
    software:
      - fastbill
      - wiso-meinbuero
      - collmex
    sources:
      - *fastbill
      - *fastbillhilfe
      - *meinbuero
      - *collmex
  - id: buchhaltung
    title: Vollständige Buchhaltung mit Übertragung
    paragraphs:
      - sevdesk erstellt die Voranmeldung laut Funktionsseite in unter zwei Minuten und sendet sie über eine integrierte ELSTER-Schnittstelle, ohne zusätzliches Zertifikat, ab dem Tarif Buchhaltung für 22,90 € im Monat bei 12 Monaten Laufzeit. Lexware Office erstellt und versendet Voranmeldung und Zusammenfassende Meldung ab Version L für 21,90 € im Monat, monatlich kündbar.
      - BuchhaltungsButler übermittelt Voranmeldung und Zusammenfassende Meldung ab dem Paket Smart über eine eigene Elster-Integration, ebenfalls ohne Zertifikat, für 34,90 € im Monat bei jährlicher Laufzeit. Vor der Übermittlung lassen sich alle Buchungen revisionssicher festschreiben. orgaMAX führt die Voranmeldung in allen Plänen ab 49 € im Monat. Norman überträgt sie über die zertifizierte ELSTER-Schnittstelle für Selbstständige im Tarif Pro für 21 € im Monat bei jährlicher Zahlung und für UG und GmbH im Tarif Max.
    software:
      - sevdesk
      - lexware-office
      - buchhaltungsbutler
      - norman
