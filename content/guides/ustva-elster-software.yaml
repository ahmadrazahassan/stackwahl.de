  - id: einschraenkungen
    title: Wo die Übertragung fehlt oder nur teilweise klappt
    paragraphs:
      - Papierkram erstellt die Voranmeldung monatlich, vierteljährlich oder jährlich, überträgt sie aber nicht selbst. Sie laden sie als XML-Datei herunter und im ELSTER-Portal hoch. Das ist schneller als Abtippen, aber ein zusätzlicher Schritt. Xentral schreibt auf seiner Buchhaltungsseite, dass BWA, Saldenliste und UStVA im aktuellen Stand des Moduls noch nicht vorgesehen sind.
      - Sage Active überträgt die Voranmeldung nur im Paket Essentials, nicht im Starter. Bei reinen Rechnungsprogrammen wie easybill und Billomat und bei Candis als Werkzeug für eingehende Rechnungen nennen die geprüften Seiten keine Übertragung, dort bleibt die Voranmeldung bei der Steuerberatung.
    sources:
      - *papierkram
      - *xentral
      - *sageactive
  - id: checkliste
    title: Checkliste vor der Entscheidung
    paragraphs:
      - Prüfen Sie in der Testphase eine echte Voranmeldung mit Ihren eigenen Buchungen, bevor Sie einen Jahresvertrag schließen. Achten Sie darauf, ob die Funktion in dem Tarif enthalten ist, den Sie buchen wollen, denn bei mehreren Anbietern beginnt sie erst in einem höheren Paket.
    points:
      - Übertragung direkt aus dem Programm oder nur XML-Export
      - Enthalten im gewünschten Tarif und nicht erst im nächsthöheren
      - Vorschau der Kennzahlen vor dem Senden
      - Soll- und Ist-Versteuerung, je nachdem, was für Sie gilt
      - Zusammenfassende Meldung, falls Sie in die EU liefern
    sources:
      - *fastbill
      - *bb
