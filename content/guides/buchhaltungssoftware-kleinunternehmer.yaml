intro: Als Kleinunternehmer stellen Sie Rechnungen ohne Umsatzsteuer aus und sparen sich die Umsatzsteuer-Voranmeldung. Das klingt einfach, doch die Rechnung braucht den richtigen Hinweis, die Umsatzgrenzen müssen im Blick bleiben, und spätestens beim Überschreiten der Grenze muss die Software umstellen können. Wir haben in allen 20 Profilen nachgesehen, welche Programme die Kleinunternehmerregelung laut Anbieter ausdrücklich unterstützen. Acht sind es.
sections:
  - id: regeln
    title: Die Regeln in Kürze
    paragraphs:
      - "Nach § 19 Absatz 1 UStG ist der Umsatz eines Unternehmers steuerfrei, wenn der Gesamtumsatz im vorangegangenen Kalenderjahr 25.000 € nicht überschritten hat und im laufenden Kalenderjahr 100.000 € nicht überschreitet. Wer die Regelung nutzt, weist keine Umsatzsteuer aus und kann im Gegenzug keine Vorsteuer abziehen."
      - Eine Rechnung als Kleinunternehmer muss nach § 34a UStDV mindestens den vollständigen Namen und die Anschrift beider Seiten, die Steuernummer, Umsatzsteuer-Identifikationsnummer oder Kleinunternehmer-Identifikationsnummer, das Ausstellungsdatum, Menge und Art der Leistung sowie das Entgelt in einer Summe mit einem Hinweis auf die Steuerbefreiung enthalten. Solche Rechnungen dürfen Sie immer als sonstige Rechnung übermitteln, also auch als einfaches PDF.
    sources:
      - *ustg19
      - *ustdv34a
  - id: worauf-achten
    title: Was gute Software für Kleinunternehmer leisten sollte
    paragraphs:
      - Entscheidend ist eine Einstellung für die Kleinunternehmerregelung, die den Hinweis auf die Steuerbefreiung automatisch auf jede Rechnung setzt und bei den Ausgaben keine Vorsteuer verbucht. Ebenso wichtig ist, dass Sie jederzeit in die Regelbesteuerung wechseln können, wenn Ihr Umsatz die Grenzen überschreitet, ohne das Programm zu wechseln.
      - Achten Sie außerdem auf den Empfang von E-Rechnungen, denn diese Pflicht gilt auch für Kleinunternehmer, und auf eine Einnahmen-Überschuss-Rechnung für die Steuererklärung. Ein günstiger oder kostenloser Einstieg ist für viele Gründer das wichtigste Kriterium.
    points:
      - Einstellung Kleinunternehmer mit automatischem Hinweis auf der Rechnung
      - Wechsel in die Regelbesteuerung im selben Programm
      - E-Rechnungen empfangen und archivieren
      - EÜR für die Steuererklärung
    sources:
      - *ustdv34a
  - id: kostenlos-starten
    title: Kostenlos oder sehr günstig starten
    paragraphs:
      - sevdesk bietet eine Einstellung Kleinunternehmer, bei der laut Hilfe-Center der Hinweis nach § 19 UStG automatisch auf die Rechnungen kommt und bei Ausgaben keine Steuer auswählbar ist. Der kostenlose Tarif erlaubt drei Rechnungen oder E-Rechnungen im Monat, der Tarif Rechnung kostet 9,90 € im Monat bei 12 Monaten Laufzeit.
      - Papierkram lässt die Kleinunternehmerregelung aktivieren und bietet ein kostenloses Paket mit bis zu 15 Belegen im Monat, das Paket S kostet 12,90 € im Monat bei jährlicher Zahlung. Collmex macht die Regelung je Geschäftsjahr wählbar, Collmex buchhaltung free kostet 0 €, das Komplettpaket basic mit Rechnungen 16,95 € im Monat und ist monatlich kündbar. Norman hat einen eigenen Tarif Klein für Kleinunternehmer für 9 € im Monat bei jährlicher Zahlung. Wichtig dabei ist, dass EÜR und Steuererklärungen dort laut FAQ nur bei jährlicher Zahlung abgegeben werden können.
