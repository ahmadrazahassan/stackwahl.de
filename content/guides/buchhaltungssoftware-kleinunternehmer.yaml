  - id: mehr-funktionen
    title: Mehr Funktionen für wachsende Kleinunternehmen
    paragraphs:
      - WISO MeinBüro berücksichtigt die Kleinunternehmerregelung laut Anbieter automatisch. Der Plan Rechnungen und Angebote kostet 130,80 € im Jahr und ist auf 25.000 € Umsatz in 365 Tagen begrenzt, was zur Umsatzgrenze der Regelung passt. FastBill macht die Kleinunternehmerregelung einstellbar und kostet im Tarif Solo 9 € im Monat bei jährlicher Abbuchung.
      - BuchhaltungsButler eignet sich laut Funktionsseite für Kleinunternehmer ebenso wie für Soll- und Istversteuerer, kostet aber mindestens 29,90 € im Monat bei jährlicher Laufzeit und ist damit eher für Kleinunternehmer mit vielen Belegen gedacht. orgaMAX lässt die Regelung in den Steuereinstellungen aktivieren, beginnt aber bei 49 € im Monat und richtet sich an Betriebe, die Auftragswesen und Buchhaltung in einem System wollen.
    software:
      - wiso-meinbuero
      - fastbill
    sources:
      - *meinbuero
      - *meinbuerokl
      - *fastbill
      - *bb
      - *orgamax
  - id: grenze-ueberschritten
    title: Wenn Ihr Umsatz die Grenze überschreitet
    paragraphs:
      - Überschreitet Ihr Umsatz im laufenden Jahr 100.000 €, endet die Steuerbefreiung nach § 19 UStG. Danach weisen Sie Umsatzsteuer aus und geben Voranmeldungen ab. Programme, die die Umsatzsteuer-Voranmeldung direkt an das Finanzamt übertragen, ersparen Ihnen dann einen Wechsel. sevdesk, FastBill, WISO MeinBüro, BuchhaltungsButler, orgaMAX, Collmex und Norman nennen eine solche Übertragung, Papierkram erstellt die Voranmeldung als XML-Datei für den Upload im ELSTER-Portal.
      - Klären Sie den Zeitpunkt des Wechsels mit Ihrer Steuerberatung, denn er hängt von den Umsätzen im Vorjahr und im laufenden Jahr ab. Dieser Artikel ersetzt keine Steuerberatung.
    sources:
      - *ustg19
      - *papierkram
