sections:
  - id: pflicht
    title: Warum GmbH und UG bilanzieren müssen
    paragraphs:
      - Eine GmbH gilt nach § 13 Abs. 3 GmbHG als Handelsgesellschaft und damit als Kaufmann. Das gilt auch für die UG, die eine besondere Form der GmbH ist. Jeder Kaufmann muss nach § 242 HGB zu Beginn eine Eröffnungsbilanz und zum Ende jedes Geschäftsjahres eine Bilanz und eine Gewinn- und Verlustrechnung aufstellen.
      - Die Erleichterung für kleine Einzelkaufleute nach § 241a HGB gilt für Kapitalgesellschaften nicht. Eine GmbH oder UG braucht deshalb immer eine doppelte Buchführung, unabhängig von ihrem Umsatz.
    sources:
      - *gmbhg
      - *hgb242
  - id: e-bilanz
    title: Die E-Bilanz an das Finanzamt
    paragraphs:
      - Nach § 5b EStG werden Bilanz und Gewinn- und Verlustrechnung nach amtlich vorgeschriebenem Datensatz elektronisch an das Finanzamt übermittelt, die sogenannte E-Bilanz. Viele Unternehmen lassen das die Steuerberatung erledigen. Wichtig ist dann, dass die Buchhaltungssoftware die Daten sauber an die Kanzlei übergibt, etwa im DATEV-Format.
      - Prüfen Sie vor dem Kauf, ob das Programm den Jahresabschluss selbst erstellt oder nur die laufende Buchhaltung führt und die Daten an die Kanzlei weitergibt. Beides ist sinnvoll, entscheidend ist die Absprache mit Ihrer Steuerberatung.
    points:
      - Doppelte Buchführung mit Kontenrahmen SKR03 oder SKR04
      - Bilanz und Gewinn- und Verlustrechnung
      - Übergabe an die Kanzlei, etwa im DATEV-Format
      - Umsatzsteuer-Voranmeldung per ELSTER
    sources:
      - *estg5b
