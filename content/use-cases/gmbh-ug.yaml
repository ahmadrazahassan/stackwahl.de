slug: gmbh-ug
title: "Buchhaltungssoftware für GmbH und UG: Programme mit Bilanz"
description: Welche Buchhaltungsprogramme eine Bilanz erstellen, wie GmbH und UG in Deutschland bilanzieren müssen und worauf es bei der Software ankommt.
label: GmbH und UG
centralQuestion: Welche Buchhaltungssoftware erstellt die Bilanz, die eine GmbH oder UG jedes Jahr braucht?
intro: Eine GmbH oder UG kann ihren Gewinn nicht mit einer einfachen Einnahmen-Überschuss-Rechnung ermitteln. Sie muss doppelt buchen und jedes Jahr eine Bilanz mit Gewinn- und Verlustrechnung aufstellen, die anschließend elektronisch an das Finanzamt geht. Viele günstige Programme für Selbstständige können das nicht. Hier stehen die Programme, die laut Anbieter eine Bilanz erstellen.
rule:
  explanation: Ausgewählt sind alle Programme der Kategorie Buchhaltungssoftware, deren Anbieter Bilanz und doppelte Buchführung ausdrücklich nennt.
  categories:
