slug: handwerk
title: "Software für Handwerksbetriebe: Angebote, Rechnungen und Buchhaltung"
description: Welche Programme sich laut Anbieter an Handwerksbetriebe richten und was Handwerker bei Rechnungen, § 13b UStG und Handwerkerleistungen beachten.
label: Handwerksbetriebe
centralQuestion: Welche Software unterstützt Handwerksbetriebe bei Angeboten, Rechnungen an Privatkunden und Bauleistungen?
intro: Im Handwerk gelten bei Rechnungen besondere Regeln. Bei Bauleistungen an andere Unternehmen geht die Steuerschuld auf den Auftraggeber über, Privatkunden brauchen eine Rechnung innerhalb von sechs Monaten, und viele wollen den Lohnanteil für ihre Steuererklärung sehen. Hier stehen die Programme, die sich laut Anbieter ausdrücklich an Handwerksbetriebe richten.
rule:
  explanation: Ausgewählt sind alle Programme, deren Anbieter Handwerksbetriebe als Zielgruppe nennt.
  targetGroups:
    - handwerk
highlights:
