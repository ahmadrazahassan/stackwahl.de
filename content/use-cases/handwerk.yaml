sections:
  - id: bauleistungen
    title: Bauleistungen an andere Unternehmen
    paragraphs:
      - Erbringen Sie Bauleistungen an Gebäuden für ein anderes Unternehmen, schuldet nach § 13b UStG in vielen Fällen der Auftraggeber die Umsatzsteuer. Ihre Rechnung weist dann keine Umsatzsteuer aus, sondern einen Hinweis auf die Steuerschuldnerschaft des Leistungsempfängers. Die Software sollte solche Rechnungen ohne Umwege erstellen können.
    sources:
      - *ustg13b
  - id: privatkunden
    title: Rechnungen an Privatkunden
    paragraphs:
      - Für Werklieferungen und Leistungen im Zusammenhang mit einem Grundstück müssen Sie nach § 14 Abs. 2 Satz 1 Nr. 3 UStG auch Privatkunden innerhalb von sechs Monaten eine Rechnung ausstellen. Viele Privatkunden nutzen die Rechnung zudem für die Steuerermäßigung nach § 35a EStG. Begünstigt sind dort nur die Arbeitskosten, und die Zahlung muss auf das Konto des Betriebs gehen.
      - Praktisch heißt das, Arbeitskosten und Material getrennt auf der Rechnung auszuweisen und Barzahlungen zu vermeiden. Prüfen Sie in der Testphase, ob das Programm getrennte Positionen für Lohn und Material bequem unterstützt.
    points:
      - Angebote, Aufträge, Abschlags- und Schlussrechnungen
      - Getrennter Ausweis von Arbeitskosten und Material
      - Rechnungen nach § 13b UStG ohne Umsatzsteuer
      - Lager und Material, wenn Sie Ware vorhalten
    sources:
      - *ustg14
      - *estg35a
