slug: onlinehandel
title: "Software für Onlinehändler: Rechnungen, Lager und EU-Umsatzsteuer"
description: Welche Programme sich an Onlinehändler richten, was die Lieferschwelle von 10.000 € und das OSS-Verfahren bedeuten und worauf Händler achten.
label: Onlinehändler
centralQuestion: Welche Software passt zu Onlinehändlern, die über Shops und Marktplätze verkaufen, auch in andere EU-Länder?
intro: Onlinehändler haben andere Sorgen als Dienstleister. Viele Bestellungen brauchen automatisch erzeugte Rechnungen, Zahlungen von PayPal, Kreditkarte und Marktplätzen müssen den Bestellungen zugeordnet werden, und wer an Privatkunden in andere EU-Länder verkauft, muss dort Umsatzsteuer abführen. Hier stehen die Programme, die sich laut Anbieter an den Onlinehandel richten, von Rechnungsprogrammen bis zum ERP.
rule:
  explanation: Ausgewählt sind alle Programme, deren Anbieter den Onlinehandel als Zielgruppe nennt.
