sections:
  - id: eu
    title: Verkäufe in andere EU-Länder
    paragraphs:
      - Verkaufen Sie Waren an Privatkunden in anderen EU-Ländern, gilt nach § 3c UStG grundsätzlich das Land als Ort der Lieferung, in dem die Ware ankommt. Dann fällt die Umsatzsteuer dieses Landes an. Ausgenommen sind kleine Händler mit Sitz in nur einem Mitgliedstaat, deren grenzüberschreitende Fernverkäufe und bestimmte Dienstleistungen zusammen im vorigen und im laufenden Jahr 10.000 € nicht übersteigen.
      - Damit Sie sich nicht in jedem Land registrieren müssen, gibt es das besondere Verfahren nach § 18j UStG, den One-Stop-Shop. Die Meldung läuft in Deutschland über das Bundeszentralamt für Steuern. Eine Software für Händler sollte die Steuersätze der Zielländer kennen und die Umsätze je Land auswerten.
    sources:
      - *ustg3c
      - *ustg18j
  - id: alltag
    title: Was Händler im Alltag brauchen
    paragraphs:
      - Je nach Größe reicht ein Rechnungsprogramm, das Shops anbindet, oder es braucht ein ERP mit Lager, Versand und Einkauf. Rechnungsprogramme rechnen oft nach Dokumenten ab, ERP-Systeme nach Nutzern oder Aufträgen. Rechnen Sie deshalb mit Ihrer tatsächlichen Zahl an Bestellungen und Personen.
      - Prüfen Sie außerdem, wie Zahlungen von Marktplätzen und Zahlungsdiensten den Bestellungen zugeordnet werden und wie die Daten zur Steuerberatung kommen. Bei großen Bestellzahlen spart eine automatische Zuordnung viele Stunden im Monat.
    points:
      - Anbindung an Shop und Marktplätze
      - Automatische Rechnungen und Gutschriften
      - Zuordnung von Zahlungen aus PayPal, Kreditkarte und Marktplätzen
      - Umsatzsteuer je EU-Land und OSS-Auswertung
      - Lager und Versand, wenn Sie selbst versenden
    sources:
      - *ustg18j
