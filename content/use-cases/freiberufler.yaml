slug: freiberufler
title: "Software für Freiberufler: Rechnungen, EÜR und Umsatzsteuer"
description: Welche Programme sich an Freiberufler richten, warum die EÜR reicht und worauf es bei Rechnungen, E-Rechnung und Umsatzsteuer ankommt.
label: Freiberufler
centralQuestion: Welche Software brauchen Freiberufler, die Rechnungen schreiben und ihren Gewinn mit der EÜR ermitteln?
intro: Freiberufler wie Designer, Berater, Übersetzer, Journalisten oder Ärzte haben es bei der Buchhaltung oft einfacher als Gewerbetreibende. Sie müssen keine Bücher führen und ermitteln ihren Gewinn mit der Einnahmen-Überschuss-Rechnung. Wichtig sind deshalb vor allem gute Rechnungen, die EÜR und, falls Sie umsatzsteuerpflichtig sind, die Voranmeldung. Hier stehen die Programme, die sich laut Anbieter an Freiberufler richten.
rule:
  explanation: Ausgewählt sind alle Programme, deren Anbieter Freiberufler als Zielgruppe nennt.
