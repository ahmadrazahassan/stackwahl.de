sections:
  - id: euer
    title: EÜR statt Bilanz
    paragraphs:
      - Als freiberuflich gilt nach § 18 EStG unter anderem eine selbständig ausgeübte wissenschaftliche, künstlerische, schriftstellerische, unterrichtende oder erzieherische Tätigkeit sowie Berufe wie Ärzte, Rechtsanwälte, Architekten, Ingenieure, Journalisten und Übersetzer. Freiberufler sind keine Kaufleute und müssen deshalb keine Bücher führen.
      - Wer nicht zur Buchführung verpflichtet ist, darf seinen Gewinn nach § 4 Abs. 3 EStG als Überschuss der Betriebseinnahmen über die Betriebsausgaben ermitteln. Eine Software für Freiberufler braucht deshalb keine Bilanz, aber eine saubere EÜR, die Sie oder Ihre Steuerberatung für die Steuererklärung nutzen.
    sources:
      - *estg18
      - *estg4
  - id: rechnungen
    title: Rechnungen und E-Rechnung
    paragraphs:
      - Für Rechnungen an andere Unternehmen gilt in Deutschland die E-Rechnung. Empfangen müssen Sie E-Rechnungen schon heute, das Ausstellen wird nach Übergangsfristen Pflicht. Achten Sie darauf, dass das Programm XRechnung oder ZUGFeRD erstellt und eingehende E-Rechnungen lesen kann. Mehr dazu steht in unserem Ratgeber zur E-Rechnungspflicht.
      - Arbeiten Sie nach Stunden, hilft eine Zeiterfassung, aus der sich Rechnungen erstellen lassen. Nutzen Sie die Kleinunternehmerregelung, muss das Programm Rechnungen ohne Umsatzsteuer mit dem passenden Hinweis erstellen.
    points:
      - Rechnungen und Angebote, auch als E-Rechnung
      - Einnahmen-Überschuss-Rechnung
      - Kleinunternehmerregelung, falls Sie sie nutzen
      - Zeiterfassung, wenn Sie nach Stunden abrechnen
    sources:
      - *ustg14
