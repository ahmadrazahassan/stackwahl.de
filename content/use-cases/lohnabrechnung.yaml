slug: lohnabrechnung
title: "Buchhaltung mit Lohnabrechnung: Programme für Betriebe mit Angestellten"
description: Welche Buchhaltungsprogramme die Lohnabrechnung gleich mitbringen, was Arbeitgeber melden müssen und worauf es bei der Auswahl ankommt.
label: Betriebe mit Angestellten
centralQuestion: Welche Buchhaltungssoftware erledigt auch die Lohnabrechnung, damit ich nicht zwei Programme brauche?
intro: Sobald Sie Angestellte haben, kommen neue Pflichten dazu. Sie führen ein Lohnkonto, melden die Lohnsteuer an das Finanzamt und Ihre Beschäftigten an die Sozialversicherung. Viele kleine Betriebe geben das an die Steuerberatung ab. Wer es selbst erledigen will, spart mit einem Programm, das Buchhaltung und Lohn verbindet, doppelte Arbeit. Hier stehen die Programme, die laut Anbieter eine Lohnabrechnung enthalten oder gegen Aufpreis anbieten.
rule:
  explanation: Ausgewählt sind alle Programme, die laut Anbieter eine Lohnabrechnung enthalten oder als Zusatz anbieten.
  facts:
    lohn:
      - ja
      - aufpreis
