sections:
  - id: pflichten
    title: Was Arbeitgeber erledigen müssen
    paragraphs:
      - Nach § 41 EStG führen Sie für jeden Beschäftigten und jedes Kalenderjahr ein Lohnkonto mit den Merkmalen für den Lohnsteuerabzug, den gezahlten Löhnen und der einbehaltenen Lohnsteuer. Nach § 41a EStG melden Sie die Lohnsteuer bis zum zehnten Tag nach Ende des Anmeldungszeitraums an das Finanzamt und führen sie ab, in der Regel elektronisch.
      - Dazu kommen nach § 28a SGB IV die Meldungen zur Sozialversicherung, etwa beim Beginn einer Beschäftigung. Eine Lohnsoftware erstellt diese Meldungen und überträgt sie, das spart Zeit und senkt das Risiko von Fehlern.
    sources:
      - *estg41
      - *estg41a
      - *sgb4
  - id: auswahl
    title: Worauf Sie bei der Auswahl achten
    paragraphs:
      - Fragen Sie zuerst, ob Lohn im Preis enthalten ist oder als Zusatz bezahlt wird, und wie sich der Preis mit der Zahl der Beschäftigten ändert. Prüfen Sie auch, ob Lohnbuchungen automatisch in die Finanzbuchhaltung übernommen werden und wie Ihre Steuerberatung die Daten erhält.
      - Bei Minijobs, Kurzarbeit oder Branchen mit Sonderregeln lohnt ein Test mit einem echten Monat. Viele Betriebe lassen die Lohnabrechnung trotz Software von der Steuerberatung prüfen, das ist mit allen Programmen hier möglich.
    points:
      - Lohn im Preis enthalten oder Zusatzmodul
      - Preis je Beschäftigtem
      - Meldungen an Finanzamt und Sozialversicherung direkt aus dem Programm
      - Übernahme der Lohnbuchungen in die Buchhaltung
    sources:
      - *estg41a
