slug: rechnungsprogramme
name: Rechnungsprogramme
description: Programme für Angebote, Rechnungen und Mahnungen, inklusive E-Rechnung nach XRechnung und ZUGFeRD.
intro: >-
  Ein Rechnungsprogramm erstellt Angebote, Rechnungen und Mahnungen und behält offene Posten im
  Blick. Seit 2025 müssen Unternehmen in Deutschland E-Rechnungen empfangen können, ab 2027
  beziehungsweise 2028 auch versenden. Das Programm sollte deshalb XRechnung und ZUGFeRD beherrschen.
launchOrder: 2
status: draft
