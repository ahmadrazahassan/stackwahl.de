slug: weclapp-vs-xentral
title: "weclapp vs. Xentral: ERP für Händler im Kostenvergleich"
description: weclapp und Xentral im Vergleich, mit Kosten für drei und fünf Nutzer, Lager, Shops, Buchhaltung, UStVA, DATEV und Testphase.
software:
  - weclapp
  - xentral
centralQuestion: Welches Cloud-ERP passt zu einem wachsenden Händler, und was kostet es bei drei oder fünf Personen im Team?
intro: weclapp aus Kitzingen und Xentral aus Augsburg sind zwei der bekanntesten Cloud-ERP-Systeme für kleine und mittlere Händler in Deutschland. Beide verbinden Aufträge, Lager und Rechnungen. Sie rechnen aber völlig unterschiedlich ab, weclapp je Nutzer, Xentral pauschal nach Plan und Auftragsvolumen, und sie decken die Buchhaltung unterschiedlich weit ab.
